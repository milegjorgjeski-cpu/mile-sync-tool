workflows:

  # ── Debug APK (брзо тестирање) ─────────────────────────────────────────
  android-debug:
    name: Android Debug APK
    max_build_duration: 30
    instance_type: mac_mini_m1

    environment:
      flutter: 3.19.0
      java: 17

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Generate code (Hive adapters)
        script: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build debug APK
        script: flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

    publishing:
      email:
        recipients:
          - your@email.com
        notify:
          success: true
          failure: true

  # ── Release APK (потпишан) ─────────────────────────────────────────────
  android-release:
    name: Android Release APK
    max_build_duration: 45
    instance_type: mac_mini_m1

    environment:
      flutter: 3.19.0
      java: 17
      android_signing:
        - mile_sync_keystore   # Се додава во CodeMagic → Code Signing

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Generate code (Hive adapters)
        script: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Flutter analyze
        script: flutter analyze --no-fatal-infos
        ignore_failure: true

      - name: Build release APK
        script: |
          flutter build apk --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/mapping/release/mapping.txt

    publishing:
      email:
        recipients:
          - your@email.com
        notify:
          success: true
          failure: true

  # ── AAB за Google Play ─────────────────────────────────────────────────
  android-playstore:
    name: Android AAB (Play Store)
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      flutter: 3.19.0
      java: 17
      android_signing:
        - mile_sync_keystore
      groups:
        - google_play_credentials   # Се додава во CodeMagic → Teams

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Generate code (Hive adapters)
        script: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Flutter analyze
        script: flutter analyze --no-fatal-infos
        ignore_failure: true

      - name: Build AAB
        script: |
          flutter build appbundle --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER

    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      - build/app/outputs/mapping/release/mapping.txt

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal        # internal / alpha / beta / production
        submit_as_draft: true
      email:
        recipients:
          - your@email.com
        notify:
          success: true
          failure: true
