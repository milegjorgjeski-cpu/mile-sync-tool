workflows:

  android-debug:
    name: Android Debug APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    working_directory: mile_sync_tool

    environment:
      flutter: 3.19.0
      java: 17

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Generate code (Hive adapters)
        script: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build debug APK
        script: flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

    publishing:
      email:
        recipients:
          - your@email.com
        notify:
          success: true
          failure: true

  android-release:
    name: Android Release APK
    max_build_duration: 45
    instance_type: mac_mini_m1
    working_directory: mile_sync_tool

    environment:
      flutter: 3.19.0
      java: 17
      android_signing:
        - mile_sync_keystore

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Generate code (Hive adapters)
        script: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build release APK
        script: |
          flutter build apk --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

    publishing:
      email:
        recipients:
          - your@email.com
        notify:
          success: true
          failure: true

  android-playstore:
    name: Android AAB (Play Store)
    max_build_duration: 60
    instance_type: mac_mini_m1
    working_directory: mile_sync_tool

    environment:
      flutter: 3.19.0
      java: 17
      android_signing:
        - mile_sync_keystore

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Generate code (Hive adapters)
        script: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build AAB
        script: |
          flutter build appbundle --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER

    artifacts:
      - build/app/outputs/bundle/release/app-release.aab

    publishing:
      email:
        recipients:
          - milegjorgjeski@gmail.com
        notify:
          success: true
          failure: true
